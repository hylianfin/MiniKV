syntax = "proto3";
package minikv;

service KV {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Cas(CasRequest) returns (CasResponse);
  rpc Scan(ScanRequest) returns (stream ScanItem);
  rpc Status(StatusRequest) returns (StatusResponse);
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestContext {
  string client_id = 1;
  uint64 request_seq = 2;
}

message PutRequest {
  RequestContext ctx = 1;
  bytes key = 2;
  bytes value = 3;
}
message PutResponse {
  Status status = 1;
}

message GetRequest {
  bytes key = 1;
  ReadMode mode = 2;
}
message GetResponse {
  Status status = 1;
  bool found = 2;
  bytes value = 3;
}

message DeleteRequest {
  RequestContext ctx = 1;
  bytes key = 2;
}
message DeleteResponse {
  Status status = 1;
  bool existed = 2;
}

message CasRequest {
  RequestContext ctx = 1;
  bytes key = 2;
  bool expect_absent = 3;
  bytes expected = 4;
  bytes new_value = 5;
}
message CasResponse {
  Status status = 1;
  bool success = 2;
  bool found = 3;
  bytes current = 4;
}

message ScanRequest {
  bytes start = 1;
  bytes end = 2;
  uint32 limit = 3;
  ReadMode mode = 4;
}
message ScanItem {
  bytes key = 1;
  bytes value = 2;
}

message StatusRequest {}
message StatusResponse {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  string leader_addr = 5;
  uint64 commit_index = 6;
  uint64 last_applied = 7;
  uint64 log_last_index = 8;
}

enum ReadMode {
  READ_LINEARIZABLE = 0;
  READ_LOG = 1;
  READ_STALE = 2;
}

enum Code {
  OK = 0;
  NOT_LEADER = 1;
  TIMEOUT = 2;
  INVALID = 3;
  UNAVAILABLE = 4;
}
message Status {
  Code code = 1;
  string message = 2;
  string leader_addr = 3;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  uint32 type = 3;
  bytes payload = 4;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  bool pre_vote = 5;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
}
