name: ci
on: [push, pull_request]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Proto compiles
        run: python -m grpc_tools.protoc -Iproto --python_out=/tmp --grpc_python_out=/tmp proto/minikv.proto
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy minikv sim
      - name: Unit tests
        run: pytest -q
